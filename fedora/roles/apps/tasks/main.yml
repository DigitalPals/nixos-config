---
- name: Import RPM Fusion release-package signing keys
  ansible.builtin.rpm_key:
    key: "https://download1.rpmfusion.org/{{ item.scope }}/fedora/RPM-GPG-KEY-rpmfusion-{{ item.scope }}-fedora-2020"
    fingerprint:
      - "{{ item.fingerprint }}"
    state: present
  loop:
    - scope: free
      fingerprint: E9A491A3DE247814E7E067EAE06F8ECDD651FF2E
    - scope: nonfree
      fingerprint: 79BDB88F9BBF73910FD4095B6A2AF96194843C65

- name: Enable RPM Fusion free repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ fedora_release }}.noarch.rpm"
    state: present
    disable_gpg_check: false

- name: Enable RPM Fusion nonfree repository
  ansible.builtin.dnf:
    name: "https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ fedora_release }}.noarch.rpm"
    state: present
    disable_gpg_check: false

- name: Install signed vendor repository definitions
  ansible.builtin.copy:
    src: "{{ item }}.repo"
    dest: "/etc/yum.repos.d/{{ item }}.repo"
    owner: root
    group: root
    mode: "0644"
  loop:
    - google-chrome
    - 1password
    - tailscale

- name: Refresh DNF metadata after repository changes
  ansible.builtin.command: dnf -q makecache
  changed_when: false
  when: not ansible_check_mode

- name: Resolve packages available for Fedora 44
  ansible.builtin.command:
    argv: "{{ ['dnf', '-q', 'repoquery', '--available', '--qf', '%{name}\\n'] + apps_fedora_packages }}"
  register: apps_available_package_query
  changed_when: false
  check_mode: false

- name: Record available and unavailable package names
  ansible.builtin.set_fact:
    apps_available_fedora_packages: "{{ apps_available_package_query.stdout_lines | unique | list }}"
    apps_unavailable_fedora_packages: "{{ apps_fedora_packages | difference(apps_available_package_query.stdout_lines) }}"

- name: Report optional packages absent from enabled repositories
  ansible.builtin.debug:
    msg: "Unavailable Fedora package (upstream installer or Mason may cover it): {{ item }}"
  loop: "{{ apps_unavailable_fedora_packages }}"

- name: Install Fedora and RPM Fusion application packages
  ansible.builtin.dnf:
    name: "{{ apps_available_fedora_packages }}"
    state: "{{ 'latest' if update_mode | default(false) | bool else 'present' }}"
    allowerasing: true
  when: apps_available_fedora_packages | length > 0

- name: Install Steam 32-bit graphics userspace
  ansible.builtin.dnf:
    name:
      - mesa-dri-drivers.i686
      - mesa-vulkan-drivers.i686
      - vulkan-loader.i686
    state: "{{ 'latest' if update_mode | default(false) | bool else 'present' }}"
  when: features.steam | bool and not ansible_check_mode

- name: Install signed vendor applications
  ansible.builtin.dnf:
    name:
      - google-chrome-stable
      - 1password
      - 1password-cli
      - tailscale
    state: "{{ 'latest' if update_mode | default(false) | bool else 'present' }}"
  when: not ansible_check_mode

- name: Enable Tailscale without authorizing the node
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started
  when: features.tailscale | bool and not ansible_check_mode

- name: Read configured system Flatpak remotes
  ansible.builtin.command: flatpak remotes --system --columns=name
  register: apps_flatpak_remotes
  changed_when: false
  check_mode: false

- name: Add full Flathub remote
  ansible.builtin.command: >-
    flatpak remote-add --if-not-exists --system flathub
    https://flathub.org/repo/flathub.flatpakrepo
  changed_when: true
  when:
    - not ansible_check_mode
    - "'flathub' not in apps_flatpak_remotes.stdout_lines"

- name: Install or update system Flatpaks
  ansible.builtin.command: >-
    flatpak install --system --noninteractive --or-update flathub {{ item }}
  register: apps_flatpak_install
  changed_when: apps_flatpak_install.stdout | trim | length > 0
  loop: "{{ apps_flatpaks }}"
  when: not ansible_check_mode

- name: Install verified upstream release helper
  ansible.builtin.copy:
    src: github-release-install
    dest: /usr/local/libexec/xps-github-release-install
    owner: root
    group: root
    mode: "0755"

- name: Install verified Elephant bundle helper
  ansible.builtin.template:
    src: elephant-install.j2
    dest: /usr/local/libexec/xps-elephant-install
    owner: root
    group: root
    mode: "0755"

- name: Resolve and install latest stable upstream applications
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-github-release-install
      - "{{ item.name }}"
      - "{{ item.repo }}"
      - "{{ item.asset_regex }}"
      - "{{ item.kind }}"
  register: apps_upstream_install
  changed_when: (apps_upstream_install.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  loop: "{{ github_release_apps }}"
  loop_control:
    label: "{{ item.name }}"
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default('', true) }}"
  when: not ansible_check_mode

- name: Report failed stable upstream application updates
  ansible.builtin.debug:
    msg: "{{ item.item.name }} update failed; installed/cached version retained: {{ item.stderr | default('unknown failure') }}"
  loop: "{{ apps_upstream_install.results | default([]) }}"
  when: item.rc | default(0) != 0

- name: Install version-gated Lumen compatibility helpers
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - src: lumen-compat-build
      dest: /usr/local/libexec/xps-lumen-compat-build
    - src: lumen-launch
      dest: /usr/local/libexec/xps-lumen-launch

- name: Build the Lumen compatibility backport when required
  ansible.builtin.command: /usr/local/libexec/xps-lumen-compat-build
  register: apps_lumen_compat_build
  changed_when: (apps_lumen_compat_build.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  when: not ansible_check_mode

- name: Report Lumen compatibility build failure while retaining the previous artifact
  ansible.builtin.debug:
    msg: "Lumen compatibility build failed; official RPM or previous artifact retained: {{ apps_lumen_compat_build.stderr | default('unknown failure') }}"
  when:
    - not ansible_check_mode
    - apps_lumen_compat_build.rc | default(0) != 0

- name: Install current Elephant and selected providers
  ansible.builtin.command: /usr/local/libexec/xps-elephant-install
  register: apps_elephant_install
  changed_when: (apps_elephant_install.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  environment:
    GH_TOKEN: "{{ lookup('env', 'GH_TOKEN') | default('', true) }}"
  when: not ansible_check_mode

- name: Report failed Elephant bundle update
  ansible.builtin.debug:
    msg: "Elephant update failed; installed version retained: {{ apps_elephant_install.stderr | default('unknown failure') }}"
  when:
    - not ansible_check_mode
    - apps_elephant_install.rc | default(0) != 0

- name: Install verified Nerd Font releases
  ansible.builtin.command: >-
    /usr/local/libexec/xps-github-release-install
    {{ item.name }} ryanoasis/nerd-fonts '^{{ item.asset }}$' font
  register: apps_nerd_font_install
  changed_when: (apps_nerd_font_install.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  loop:
    - { name: nerd-font-jetbrains-mono, asset: "JetBrainsMono[.]tar[.]xz" }
    - { name: nerd-font-fira-code, asset: "FiraCode[.]tar[.]xz" }
  when: not ansible_check_mode

- name: Report failed Nerd Font updates
  ansible.builtin.debug:
    msg: "{{ item.item.name }} update failed; installed font retained: {{ item.stderr | default('unknown failure') }}"
  loop: "{{ apps_nerd_font_install.results | default([]) }}"
  when: item.rc | default(0) != 0

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f
  changed_when: true
  when:
    - not ansible_check_mode
    - apps_nerd_font_install.results | default([]) | selectattr('changed') | list | length > 0

- name: Install source build helper
  ansible.builtin.copy:
    src: source-app-build
    dest: /usr/local/libexec/xps-source-app-build
    owner: root
    group: root
    mode: "0755"

- name: Build source-only applications when their newest tag changes
  ansible.builtin.command:
    argv:
      - /usr/local/libexec/xps-source-app-build
      - "{{ item.name }}"
      - "{{ item.repo_url }}"
      - "{{ item.binary_names | join(',') }}"
  register: apps_source_build
  changed_when: (apps_source_build.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  loop: "{{ source_apps }}"
  loop_control:
    label: "{{ item.name }}"
  when: features.source_builds | bool and not ansible_check_mode

- name: Report source build failures while retaining the previous version
  ansible.builtin.debug:
    msg: "{{ item.item.name }} update failed; previous artifact retained: {{ item.stderr | default('unknown failure') }}"
  loop: "{{ apps_source_build.results | default([]) }}"
  when: item.rc | default(0) != 0

- name: Install Android SDK update helper
  ansible.builtin.template:
    src: android-sdk-update.j2
    dest: /usr/local/libexec/xps-android-sdk-update
    owner: root
    group: root
    mode: "0755"

- name: Install or update command-line Android SDK
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command: /usr/local/libexec/xps-android-sdk-update
  register: apps_android_update
  changed_when: (apps_android_update.stdout | regex_search('(?m)^CHANGED:')) is not none
  failed_when: false
  when: not ansible_check_mode

- name: Report Android SDK update failure while retaining installed tools
  ansible.builtin.debug:
    msg: "Android SDK update failed; installed SDK retained: {{ apps_android_update.stderr | default('unknown failure') }}"
  when:
    - not ansible_check_mode
    - apps_android_update.rc | default(0) != 0

- name: Select Voxtype Intel Vulkan backend
  ansible.builtin.command: >-
    voxtype --config {{ primary_home }}/.config/voxtype/config.toml
    setup gpu --enable
  changed_when: false
  when: not ansible_check_mode

- name: Download Voxtype base English model when absent
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command: voxtype setup --download --model base --no-post-install
  args:
    creates: "{{ primary_home }}/.local/share/voxtype/models/ggml-base.bin"
  failed_when: false
  when: not ansible_check_mode

- name: Initialize the user Rustup installation
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - /usr/bin/rustup-init
      - -y
      - --no-modify-path
      - --default-toolchain
      - nightly
      - --component
      - rustfmt
      - --component
      - rust-analyzer
  args:
    creates: "{{ primary_home }}/.cargo/bin/rustup"
  register: apps_rustup_init
  failed_when: false
  when: not ansible_check_mode

- name: Install nightly Rust toolchain and components
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command:
    argv:
      - "{{ primary_home }}/.cargo/bin/rustup"
      - toolchain
      - install
      - nightly
      - --profile
      - default
      - --component
      - rustfmt
      - --component
      - rust-analyzer
  register: apps_rustup_nightly
  changed_when: "'unchanged' not in (apps_rustup_nightly.stdout | lower)"
  failed_when: false
  when:
    - not ansible_check_mode
    - apps_rustup_init.rc | default(0) == 0

- name: Report Rust nightly update failure while retaining the installed toolchain
  ansible.builtin.debug:
    msg: "Rust nightly update failed; installed toolchain retained: {{ apps_rustup_nightly.stderr | default('unknown failure') }}"
  when:
    - not ansible_check_mode
    - apps_rustup_nightly.rc | default(0) != 0

- name: Install user CLI updater
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.copy:
    src: update-user-tools
    dest: "{{ primary_home }}/.local/bin/update-user-tools"
    mode: "0755"

- name: Install or update user-managed CLIs
  become: true
  become_user: "{{ primary_user }}"
  ansible.builtin.command: "{{ primary_home }}/.local/bin/update-user-tools"
  register: apps_user_tools_update
  changed_when: (apps_user_tools_update.stdout | regex_search('(?m)^CHANGED:')) is not none
  when: not ansible_check_mode
